<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Home</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .home-card {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .home-title {
            margin-bottom: 20px;
            font-weight: 500;
        }

        .home-links a {
            margin: 0 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mt-3">

        <!-- LEFT NAV -->
        <div>
            <a href="/bidList/list">Bid List</a> |
            <a href="/curvePoint/list">Curve Points</a> |
            <a href="/rating/list">Ratings</a> |
            <a href="/trade/list">Trade</a> |
            <a href="/ruleName/list">Rule</a>
        </div>

        <!-- RIGHT AUTH -->
        <div>

            <!-- LOGIN -->
            <a sec:authorize="isAnonymous()"
               href="/login"
               class="btn btn-sm btn-outline-primary">
                Login
            </a>

            <!-- LOGOUT -->
            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  style="display:inline;">
                <button class="btn btn-sm btn-outline-primary">Logout</button>
            </form>

        </div>

    </div>

    <!-- CARD -->
    <div class="home-card">

        <h3 class="home-title">Welcome</h3>

        <p class="mb-4">
            This is your application dashboard.
        </p>

        <!-- ACTIONS -->
        <div class="home-links">

            <a href="/bidList/list" class="btn btn-primary btn-sm">
                Bid List
            </a>

            <a href="/user/list"
               class="btn btn-outline-secondary btn-sm">
                User Management
            </a>

        </div>

    </div>

</div>

</body>
</html>

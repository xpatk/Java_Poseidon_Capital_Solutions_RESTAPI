<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px 60px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h3 {
            margin-bottom: 25px;
            font-weight: normal;
        }

        p {
            margin: 0;
        }

        a {
            color: #4a4a4a;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">
    <h3>HOME PAGE</h3>
    <p>
        <a th:href="@{/login}">Login</a>
        or create one
        <a th:href="@{/user/list}">User management</a>
    </p>
</div>

</body>
</html>

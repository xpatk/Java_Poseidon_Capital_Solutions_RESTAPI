<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Add Curve Point</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary btn-sm">Login</a>

            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Add New Curve Point</h2>

    <form th:action="@{/curvePoint/validate}" th:object="${curvePoint}" method="post">

        <div class="mb-3">
            <label class="form-label">Curve ID</label>
            <input type="number" th:field="*{curveId}" class="form-control" required>
            <div class="text-danger" th:errors="*{curveId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Term</label>
            <input type="number" step="0.01" min="0.0"
                   th:field="*{term}" class="form-control" required>
            <div class="text-danger" th:errors="*{term}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Value</label>
            <input type="number" step="0.01" min="0.0"
                   th:field="*{value}" class="form-control" required>
            <div class="text-danger" th:errors="*{value}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/curvePoint/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>

</div>
</body>
</html>

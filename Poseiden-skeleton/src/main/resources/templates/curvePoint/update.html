<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Update Curve Point</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <h2 class="mb-4">Update Curve Point</h2>

    <form th:action="@{/curvePoint/update/{id}(id=${curvePoint.id})}"
          th:object="${curvePoint}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Term</label>
            <input type="number" step="0.01" min="0.01" th:field="*{term}" class="form-control">
            <div class="text-danger" th:errors="*{term}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Value</label>
            <input type="number" step="0.01" min="0.01" th:field="*{value}" class="form-control">
            <div class="text-danger" th:errors="*{value}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/curvePoint/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Update</button>
        </div>

    </form>

</div>
</body>
</html>

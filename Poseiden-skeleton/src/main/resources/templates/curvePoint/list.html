<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Curve Point List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/bidList/list">Bid List</a> |
            <a href="/curvePoint/list">Curve Points</a> |
            <a href="/rating/list">Ratings</a> |
            <a href="/trade/list">Trade</a> |
            <a href="/ruleName/list">Rule</a>
        </div>

        <div class="text-end">

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button class="btn btn-sm btn-outline-primary">Logout</button>
            </form>
        </div>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${param.success}" class="alert alert-success">
        Curve Point successfully added
    </div>

    <!-- TITLE -->
    <h2 class="mb-3">Curve Point List</h2>

    <!-- ADD BUTTON -->
    <a href="/curvePoint/add" class="btn btn-primary btn-sm mb-3">+ Add New</a>

    <!-- TABLE -->
    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>CurveId</th>
            <th>Term</th>
            <th>Value</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="curvePoint : ${curvePoints}">
            <td th:text="${curvePoint.id}"></td>
            <td th:text="${curvePoint.curveId}"></td>
            <td th:text="${curvePoint.term}"></td>
            <td th:text="${curvePoint.value}"></td>
            <td class="text-center">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/curvePoint/update/{id}(id=${curvePoint.id})}">
                    Edit
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/curvePoint/delete/{id}(id=${curvePoint.id})}">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>

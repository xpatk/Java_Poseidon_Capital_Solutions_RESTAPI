<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Add Rule</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Add New Rule</h2>

    <form th:action="@{/ruleName/validate}" th:object="${ruleName}" method="post">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" th:field="*{description}" class="form-control">
            <div class="text-danger" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Json</label>
            <input type="text" th:field="*{json}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Template</label>
            <input type="text" th:field="*{template}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">SQL</label>
            <input type="text" th:field="*{sqlStr}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">SQL Part</label>
            <input type="text" th:field="*{sqlPart}" class="form-control">
        </div>

        <div class="d-flex gap-2">
            <a href="/ruleName/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>

</div>
</body>
</html>

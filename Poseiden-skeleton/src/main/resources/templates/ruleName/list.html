<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Rule List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/bidList/list">Bid List</a> |
            <a href="/curvePoint/list">Curve Points</a> |
            <a href="/rating/list">Ratings</a> |
            <a href="/trade/list">Trade</a> |
            <a href="/ruleName/list">Rule</a>
        </div>

        <div class="text-end">

            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button class="btn btn-sm btn-outline-primary">Logout</button>
            </form>
        </div>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        Rule successfully added
    </div>

    <h2 class="mb-3">Rule List</h2>

    <a href="/ruleName/add" class="btn btn-primary btn-sm mb-3">+ Add New</a>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Description</th>
            <th>Json</th>
            <th>Template</th>
            <th>SQL</th>
            <th>SQL Part</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="ruleName : ${ruleNames}">
            <td th:text="${ruleName.id}"></td>
            <td th:text="${ruleName.name}"></td>
            <td th:text="${ruleName.description}"></td>
            <td th:text="${ruleName.json}"></td>
            <td th:text="${ruleName.template}"></td>
            <td th:text="${ruleName.sqlStr}"></td>
            <td th:text="${ruleName.sqlPart}"></td>

            <td class="text-center">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/ruleName/update/{id}(id=${ruleName.id})}">
                    Edit
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/ruleName/delete/{id}(id=${ruleName.id})}">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>

    </table>

</div>
</body>
</html>

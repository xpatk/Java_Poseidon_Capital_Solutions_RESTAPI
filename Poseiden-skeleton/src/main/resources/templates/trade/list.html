<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Trade List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/bidList/list">Bid List</a> |
            <a href="/curvePoint/list">Curve Points</a> |
            <a href="/rating/list">Ratings</a> |
            <a href="/trade/list">Trade</a> |
            <a href="/ruleName/list">Rule</a>
        </div>

        <div class="text-end">

            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button class="btn btn-sm btn-outline-primary">Logout</button>
            </form>
        </div>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${param.success}" class="alert alert-success">
        Trade successfully added
    </div>

    <!-- TITLE -->
    <h2 class="mb-4">Trade List</h2>

    <!-- ADD BUTTON -->
    <a href="/trade/add" class="btn btn-primary mb-3">+ Add New</a>

    <!-- TABLE -->
    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Account</th>
            <th>Type</th>
            <th>Buy Quantity</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="trade : ${trades}">
            <td th:text="${trade.id}"></td>
            <td th:text="${trade.account}"></td>
            <td th:text="${trade.type}"></td>
            <td th:text="${trade.buyQuantity}"></td>
            <td class="text-center">

                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/trade/update/{id}(id=${trade.id})}">
                    Edit
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/trade/delete/{id}(id=${trade.id})}">
                    Delete
                </a>

            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>

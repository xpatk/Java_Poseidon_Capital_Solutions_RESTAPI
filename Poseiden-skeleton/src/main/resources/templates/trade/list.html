<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Trade List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <div th:if="${param.success}" class="alert alert-success">
        Trade successfully added
    </div>

    <h2 class="mb-4">Trade List</h2>

    <a href="/trade/add" class="btn btn-primary mb-3">+ Add New</a>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Account</th>
            <th>Type</th>
            <th>Buy Quantity</th>
            <th>Sell Quantity</th>
            <th>Buy Price</th>
            <th>Sell Price</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="trade : ${trades}">
            <td th:text="${trade.id}"></td>
            <td th:text="${trade.account}"></td>
            <td th:text="${trade.type}"></td>
            <td th:text="${trade.buyQuantity}"></td>
            <td th:text="${trade.sellQuantity}"></td>
            <td th:text="${trade.buyPrice}"></td>
            <td th:text="${trade.sellPrice}"></td>
            <td class="text-center">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/trade/update/{id}(id=${trade.id})}">Edit</a>
                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/trade/delete/{id}(id=${trade.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Update Trade</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <h2 class="mb-4">Update Trade</h2>

    <form th:action="@{/trade/update/{id}(id=${trade.id})}"
          th:object="${trade}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Account</label>
            <input type="text" th:field="*{account}" class="form-control">
            <div class="text-danger" th:errors="*{account}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" th:field="*{type}" class="form-control">
            <div class="text-danger" th:errors="*{type}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Buy Quantity</label>
            <input type="number" min="0.0" step="0.01" th:field="*{buyQuantity}" class="form-control">
            <div class="text-danger" th:errors="*{buyQuantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Sell Quantity</label>
            <input type="number" min="0.0" step="0.01" th:field="*{sellQuantity}" class="form-control">
            <div class="text-danger" th:errors="*{sellQuantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Buy Price</label>
            <input type="number" min="0.0" step="0.01" th:field="*{buyPrice}" class="form-control">
            <div class="text-danger" th:errors="*{buyPrice}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Sell Price</label>
            <input type="number" min="0.0" step="0.01" th:field="*{sellPrice}" class="form-control">
            <div class="text-danger" th:errors="*{sellPrice}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/trade/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Update</button>
        </div>

    </form>

</div>
</body>
</html>

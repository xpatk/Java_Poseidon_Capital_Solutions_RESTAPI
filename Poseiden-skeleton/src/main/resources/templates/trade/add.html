<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Add Trade</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/bidList/list">Bid List</a> |
            <a href="/curvePoint/list">Curve Points</a> |
            <a href="/rating/list">Ratings</a> |
            <a href="/trade/list">Trade</a> |
            <a href="/ruleName/list">Rule</a>
        </div>

        <div class="text-end">

            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button class="btn btn-sm btn-outline-primary">Logout</button>
            </form>
        </div>
    </div>

    <!-- TITLE -->
    <h2 class="mb-4">Add New Trade</h2>

    <!-- FORM -->
    <form th:action="@{/trade/validate}" th:object="${trade}" method="post">

        <!-- ACCOUNT -->
        <div class="mb-3">
            <label class="form-label">Account</label>
            <input type="text" th:field="*{account}" class="form-control" placeholder="Account">
            <div class="text-danger" th:errors="*{account}"></div>
        </div>

        <!-- TYPE -->
        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" th:field="*{type}" class="form-control" placeholder="Type">
            <div class="text-danger" th:errors="*{type}"></div>
        </div>

        <!-- BUY QUANTITY -->
        <div class="mb-3">
            <label class="form-label">Buy Quantity</label>
            <input type="number" min="0.01" step="0.01"
                   th:field="*{buyQuantity}" class="form-control" placeholder="Buy Quantity">
            <div class="text-danger" th:errors="*{buyQuantity}"></div>
        </div>

        <!-- BUTTONS -->
        <div class="d-flex gap-2">
            <a href="/trade/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>

</div>
</body>
</html>

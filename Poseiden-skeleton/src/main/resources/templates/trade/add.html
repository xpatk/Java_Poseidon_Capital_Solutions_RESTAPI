<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Add Trade</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <!-- TITLE -->
    <h2 class="mb-4">Add New Trade</h2>

    <!-- FORM -->
    <form th:action="@{/trade/validate}" th:object="${trade}" method="post">

        <div class="mb-3">
            <label class="form-label">Account</label>
            <input type="text" th:field="*{account}" class="form-control">
            <div class="text-danger" th:errors="*{account}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" th:field="*{type}" class="form-control">
            <div class="text-danger" th:errors="*{type}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Buy Quantity</label>
            <input type="number" min="0.01" step="0.01"
                   th:field="*{buyQuantity}" class="form-control">
            <div class="text-danger" th:errors="*{buyQuantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Sell Quantity</label>
            <input type="number" min="0.0" step="0.01"
                   th:field="*{sellQuantity}" class="form-control">
            <div class="text-danger" th:errors="*{sellQuantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Buy Price</label>
            <input type="number" min="0.0" step="0.01"
                   th:field="*{buyPrice}" class="form-control">
            <div class="text-danger" th:errors="*{buyPrice}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Sell Price</label>
            <input type="number" min="0.0" step="0.01"
                   th:field="*{sellPrice}" class="form-control">
            <div class="text-danger" th:errors="*{sellPrice}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/trade/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>

</div>
</body>
</html>

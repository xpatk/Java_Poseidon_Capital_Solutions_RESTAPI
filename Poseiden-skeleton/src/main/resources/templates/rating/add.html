<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Add Rating</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Add New Rating</h2>

    <form th:action="@{/rating/validate}" th:object="${rating}" method="post">

        <div class="mb-3">
            <label class="form-label">Moody's Rating</label>
            <input type="text" th:field="*{moodysRating}" class="form-control">
            <div class="text-danger" th:errors="*{moodysRating}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">S&P Rating</label>
            <input type="text" th:field="*{sandPRating}" class="form-control">
            <div class="text-danger" th:errors="*{sandPRating}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fitch Rating</label>
            <input type="text" th:field="*{fitchRating}" class="form-control">
            <div class="text-danger" th:errors="*{fitchRating}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Order</label>
            <input type="number" min="1" th:field="*{orderNumber}" class="form-control">
            <div class="text-danger" th:errors="*{orderNumber}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/rating/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>

</div>
</body>
</html>

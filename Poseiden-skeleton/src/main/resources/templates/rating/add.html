<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Add Rating</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <h2 class="mb-4">Add New Rating</h2>

    <form th:action="@{/rating/validate}" th:object="${rating}" method="post">

        <div class="mb-3">
            <label class="form-label">Moody's Rating</label>
            <input type="text" th:field="*{moodysRating}" class="form-control">
            <div class="text-danger" th:errors="*{moodysRating}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">S&P Rating</label>
            <input type="text" th:field="*{sandPRating}" class="form-control">
            <div class="text-danger" th:errors="*{sandPRating}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fitch Rating</label>
            <input type="text" th:field="*{fitchRating}" class="form-control">
            <div class="text-danger" th:errors="*{fitchRating}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Order</label>
            <input type="number" min="1" th:field="*{orderNumber}" class="form-control">
            <div class="text-danger" th:errors="*{orderNumber}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/rating/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>

</div>
</body>
</html>

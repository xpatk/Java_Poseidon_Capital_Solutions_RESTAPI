<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Rating List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/bidList/list">Bid List</a> |
            <a href="/curvePoint/list">Curve Points</a> |
            <a href="/rating/list">Ratings</a> |
            <a href="/trade/list">Trade</a> |
            <a href="/ruleName/list">Rule</a>
        </div>

        <div class="text-end">

            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button class="btn btn-sm btn-outline-primary">Logout</button>
            </form>
        </div>
    </div>

    <!-- SUCCESS -->
    <div th:if="${param.success}" class="alert alert-success">
        Rating successfully added
    </div>

    <h2 class="mb-3">Rating List</h2>

    <a href="/rating/add" class="btn btn-primary btn-sm mb-3">+ Add New</a>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Moody's</th>
            <th>S&P</th>
            <th>Fitch</th>
            <th>Order</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="rating : ${ratings}">
            <td th:text="${rating.id}"></td>
            <td th:text="${rating.moodysRating}"></td>
            <td th:text="${rating.sandPRating}"></td>
            <td th:text="${rating.fitchRating}"></td>
            <td th:text="${rating.orderNumber}"></td>

            <td class="text-center">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/rating/update/{id}(id=${rating.id})}">
                    Edit
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/rating/delete/{id}(id=${rating.id})}">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>

    </table>

</div>
</body>
</html>

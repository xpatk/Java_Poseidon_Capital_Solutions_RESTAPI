<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Rating List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <div th:if="${param.success}" class="alert alert-success">
        Rating successfully added
    </div>

    <h2 class="mb-3">Rating List</h2>

    <a href="/rating/add" class="btn btn-primary btn-sm mb-3">+ Add New</a>

    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Moody's</th>
            <th>S&P</th>
            <th>Fitch</th>
            <th>Order</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="rating : ${ratings}">
            <td th:text="${rating.id}"></td>
            <td th:text="${rating.moodysRating}"></td>
            <td th:text="${rating.sandPRating}"></td>
            <td th:text="${rating.fitchRating}"></td>
            <td th:text="${rating.orderNumber}"></td>

            <td class="text-center">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/rating/update/{id}(id=${rating.id})}">
                    Edit
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/rating/delete/{id}(id=${rating.id})}">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>

    </table>

</div>
</body>
</html>

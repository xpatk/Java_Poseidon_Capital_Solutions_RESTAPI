<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<title>Home</title>
<link rel="stylesheet" href="../../css/bootstrap.min.css" >
</head>
<body>
<div class="container mt-5">

    <h2 class="mb-4">Add New Bid</h2>

    <form th:action="@{/bidList/validate}" th:object="${bidList}" method="post">

        <div class="mb-3">
            <label>Account</label>
            <input type="text" th:field="*{account}" class="form-control">
            <div class="text-danger" th:errors="*{account}"></div>
        </div>

        <div class="mb-3">
            <label>Type</label>
            <input type="text" th:field="*{type}" class="form-control">
            <div class="text-danger" th:errors="*{type}"></div>
        </div>

        <div class="mb-3">
            <label>Bid Quantity</label>
            <input type="number" min="0.01" step="0.01" th:field="*{bidQuantity}" class="form-control">
            <div class="text-danger" th:errors="*{bidQuantity}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/bidList/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>
</div>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Bid List</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()"
               href="/login"
               class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <!-- SUCCESS MESSAGE -->
    <div th:if="${param.success}" class="alert alert-success">
        Bid successfully added
    </div>

    <!-- TITLE -->
    <div class="row mb-3">
        <div class="col">
            <h2>Bid List</h2>
        </div>
    </div>

    <!-- ADD BUTTON -->
    <div class="row mb-3">
        <div class="col">
            <a href="/bidList/add" class="btn btn-primary btn-sm">+ Add New</a>
        </div>
    </div>

    <!-- TABLE -->
    <div class="row">
        <div class="col">
            <table class="table table-striped table-hover shadow-sm">
                <thead class="table-light">
                <tr>
                    <th>Id</th>
                    <th>Account</th>
                    <th>Type</th>
                    <th>Bid Quantity</th>
                    <th>Ask Quantity</th>
                    <th>Bid</th>
                    <th>Ask</th>
                    <th class="text-center">Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="bidList : ${bidLists}">
                    <td th:text="${bidList.id}"></td>
                    <td th:text="${bidList.account}"></td>
                    <td th:text="${bidList.type}"></td>
                    <td th:text="${bidList.bidQuantity}"></td>
                    <td th:text="${bidList.askQuantity}"></td>
                    <td th:text="${bidList.bid}"></td>
                    <td th:text="${bidList.ask}"></td>
                    <td class="text-center">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/bidList/update/{id}(id=${bidList.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger"
                           th:href="@{/bidList/delete/{id}(id=${bidList.id})}">Delete</a>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>

</div>
</body>
</html>

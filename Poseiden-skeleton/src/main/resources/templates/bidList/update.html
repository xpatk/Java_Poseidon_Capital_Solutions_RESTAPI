<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Update Bid</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <!-- HEADER -->
    <h2 class="mb-4">Update Bid</h2>

    <!-- FORM -->
    <form th:action="@{/bidList/update/{id}(id=${bidList.id})}"
          th:object="${bidList}"
          method="post">

        <!-- hidden ID -->
        <input type="hidden" th:field="*{id}"/>

        <!-- ACCOUNT -->
        <div class="mb-3">
            <label class="form-label">Account</label>
            <input type="text" th:field="*{account}" class="form-control">
            <div class="text-danger" th:errors="*{account}"></div>
        </div>

        <!-- TYPE -->
        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" th:field="*{type}" class="form-control">
            <div class="text-danger" th:errors="*{type}"></div>
        </div>

        <!-- BID QUANTITY -->
        <div class="mb-3">
            <label class="form-label">Bid Quantity</label>
            <input type="number"
                   min="0.01"
                   step="0.01"
                   th:field="*{bidQuantity}"
                   class="form-control">
            <div class="text-danger" th:errors="*{bidQuantity}"></div>
        </div>

        <!-- BUTTONS -->
        <div class="d-flex gap-2">
            <a href="/bidList/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Update</button>
        </div>

    </form>

</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Update Bid</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Update Bid</h2>

    <form th:action="@{/bidList/update/{id}(id=${bidList.id})}"
          th:object="${bidList}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Account</label>
            <input type="text" th:field="*{account}" class="form-control">
            <div class="text-danger" th:errors="*{account}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Type</label>
            <input type="text" th:field="*{type}" class="form-control">
            <div class="text-danger" th:errors="*{type}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Bid Quantity</label>
            <input type="number" min="0.01" step="0.01" th:field="*{bidQuantity}" class="form-control">
            <div class="text-danger" th:errors="*{bidQuantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ask Quantity</label>
            <input type="number" min="0.01" step="0.01" th:field="*{askQuantity}" class="form-control">
            <div class="text-danger" th:errors="*{askQuantity}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Bid</label>
            <input type="number" min="0.01" step="0.01" th:field="*{bid}" class="form-control">
            <div class="text-danger" th:errors="*{bid}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ask</label>
            <input type="number" min="0.01" step="0.01" th:field="*{ask}" class="form-control">
            <div class="text-danger" th:errors="*{ask}"></div>
        </div>

        <div class="d-flex gap-2">
            <a href="/bidList/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Update</button>
        </div>

    </form>

</div>
</body>
</html>

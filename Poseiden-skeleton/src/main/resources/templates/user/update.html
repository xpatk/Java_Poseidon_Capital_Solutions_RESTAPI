<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Update User</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
            <a class="nav-link" href="/user/list">Users</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()"
               href="/login"
               class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Update User</h2>

    <form th:action="@{/user/update/{id}(id=${user.id})}"
          th:object="${user}"
          method="post">

        <!-- FULL NAME -->
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" th:field="*{fullname}" class="form-control">
            <div class="text-danger" th:errors="*{fullname}"></div>
        </div>

        <!-- USERNAME -->
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control">
            <div class="text-danger" th:errors="*{username}"></div>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control"
                   placeholder="Leave empty to keep current password">
            <div class="text-danger" th:errors="*{password}"></div>
        </div>

        <!-- ROLE -->
        <div class="mb-3">
            <label class="form-label">Role</label>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       th:field="*{role}"
                       value="ADMIN">
                <label class="form-check-label">Admin</label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       th:field="*{role}"
                       value="USER">
                <label class="form-check-label">User</label>
            </div>

            <div class="text-danger" th:errors="*{role}"></div>
        </div>

        <!-- HIDDEN ID -->
        <input type="hidden" th:field="*{id}">

        <!-- BUTTONS -->
        <div class="d-flex gap-2">
            <a href="/user/list" class="btn btn-danger">Cancel</a>
            <button type="submit" class="btn btn-primary">Update</button>
        </div>

    </form>

</div>
</body>
</html>

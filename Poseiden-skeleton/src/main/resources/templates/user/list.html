<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>User List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
<div class="container mt-5">

    <!-- TOP BAR -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/bidList/list">Bid List</a> |
            <a href="/curvePoint/list">Curve Points</a> |
            <a href="/rating/list">Ratings</a> |
            <a href="/trade/list">Trade</a> |
            <a href="/ruleName/list">Rule</a> |
            <a href="/user/list">Users</a>
        </div>

        <div class="text-end">
            <form th:action="@{/logout}" method="POST" style="display:inline;">
                <button class="btn btn-sm btn-outline-primary">Logout</button>
            </form>
        </div>
    </div>

    <!-- TITLE -->
    <h2 class="mb-4">User List</h2>

    <!-- ADD BUTTON -->
    <a href="/user/add" class="btn btn-primary mb-3">+ Add New User</a>

    <!-- TABLE -->
    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Full Name</th>
            <th>Username</th>
            <th>Role</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.fullname}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>
            <td class="text-center">

                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/user/update/{id}(id=${user.id})}">
                    Edit
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/user/delete/{id}(id=${user.id})}">
                    Delete
                </a>

            </td>
        </tr>
        </tbody>

    </table>

</div>
</body>
</html>

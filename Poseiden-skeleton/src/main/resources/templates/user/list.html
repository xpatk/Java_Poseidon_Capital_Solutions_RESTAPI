<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>User List</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <div class="container-fluid">

        <div class="navbar-nav">
            <a class="nav-link" href="/bidList/list">Bid</a>
            <a class="nav-link" href="/curvePoint/list">Curve</a>
            <a class="nav-link" href="/rating/list">Rating</a>
            <a class="nav-link" href="/trade/list">Trade</a>
            <a class="nav-link" href="/ruleName/list">Rule</a>
            <a class="nav-link" href="/user/list">Users</a>
        </div>

        <div class="d-flex">
            <a sec:authorize="isAnonymous()"
               href="/login"
               class="btn btn-outline-primary btn-sm">
                Login
            </a>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  class="ms-2">
                <button class="btn btn-primary btn-sm">Logout</button>
            </form>
        </div>

    </div>
</nav>

<div class="container mt-5">

    <!-- TITLE -->
    <h2 class="mb-4">User List</h2>

    <!-- ADD BUTTON -->
    <a href="/user/add" class="btn btn-primary mb-3">+ Add New User</a>

    <!-- TABLE -->
    <table class="table table-striped table-hover shadow-sm">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Full Name</th>
            <th>Username</th>
            <th>Role</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.fullname}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>
            <td class="text-center">

                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/user/update/{id}(id=${user.id})}">
                    Edit
                </a>

                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/user/delete/{id}(id=${user.id})}">
                    Delete
                </a>

            </td>
        </tr>
        </tbody>

    </table>

</div>
</body>
</html>
